added: true
notes: |-
  ## 官方信息
  - **版本**：待查
  - **获取**：待查（未找到确定的官方物品）
  - **官方形态**：幼年商队雷龙是三人 + 商队/拍卖行的多人坐骑（原版 BFA 雷龙，三人+拍卖行）

  ## 模型说明（2026-11-22 换模 + 降为单人坐骑）
  - 本条目**改用 `brontosaurus蛇颈龙坐骑1/brontosaurus/brontosaurus.m2`**（无驮架的素体蛇颈龙）。
    原 `babybrontosaurus长颈龙坐骑/babybrontosaurus/babybrontosaurus.m2` 贴图虽完好，但只有
    1/2/2 submesh、**没有座位几何体**，背上光秃秃，撑不起官方商队形态，挂件必然悬空。
  - `brontosaurus.m2` 的 M2 贴图表只有 2 项：type 11（= CreatureDisplayInfo 的
    TextureVariation_1，实体）+ type 0 硬编码 `creature\brontosaurus\armorreflect4.blp`。
    4 个 skin（00/01/02/03）共 28 个 batch **全部**走 textureLookup=0 →
    **TextureVariation_1 必须是 `brontosaurus_green`**（tv2/tv3 不被引用，仍写同值保持一致）。
  - 该模型**不含驮架**：`creature/brontosaurus/` 下虽然残留 `brontosauruspack_*.blp`
    （驮架贴图），但模型没有任何 batch 引用它们。
  - 3.3.5 原版 DBC 里没有任何记录引用 `creature\brontosaurus\brontosaurus.m2`，路径不与原版冲突。

  ## 降级为单人坐骑（2026-11-22）
  - 官方 312（巨商队猛犸象）与自建 90001 的乘客挂点都按「带驮架的模型」设计，
    本模型既无座位几何体、骨骼也对不上（挂件会落到肚子上）→ **移除 `vehicle` 块**，
    `creature_template.VehicleId=0`，AC 走 `Unit::Mount` 单人骑乘路径，
    不再生成商人/拍卖行 NPC 挂件。
  - 随之删除自建 **Vehicle.dbc 90001** 与 **VehicleSeat.dbc 91001–91007**（换模后无引用；
    Vehicle 90000 归 #0062，保留）。

  ## 兄弟条目备注
  - #24 雄壮商队雷龙 用 `brontosauruspack.m2`（**带驮架、贴图完好**），
    是库内唯一能撑起商队形态的雷龙模型 —— 别把本条目换成它，两条会撞模型。
  - `brontosaurusmount雄壮商队雷龙/brontosaurusmount.m2` 是**坏模型**（贴图槽被清空，
    渲染必为白色），详见 #24 条目的备注；修好之前不要使用。
