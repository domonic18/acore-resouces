[package]
name = "model-converter"
version = "0.1.0"
edition = "2021"
authors = ["acore-resouces Team"]
description = "PoC M2 → glTF 转换工具（warcraft-rs / wow-m2 封装）"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# 注意：crates.io 上的 wow-m2（warcraft-rs 生态）主要用于解析 M2 与版本转换，
# 并不直接导出 glTF。本 PoC 使用标准库手动解析 M2 头，生成最小 glTF 占位。
# 后续 Phase 3 可基于解析结果手动构建完整 glTF，或评估 wow.export 等现有工具。

[profile.release]
opt-level = 3
lto = true
