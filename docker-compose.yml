services:
  # ============================================
  # Web 服务：前端静态文件 + FastAPI 后端合并部署
  # 访问地址：http://localhost:8080
  # ============================================
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: acore-resources-web
    ports:
      - "8080:8000"
    env_file:
      # 分发端地址与密钥（DISTRO_API_KEY 等）
      - ./backend/.env
    environment:
      - PROJECT_ROOT=/app
      # 宿主侧项目根：前端展示的文件路径由 /app 映射回宿主真实路径（复制后可直接前往）
      - HOST_PROJECT_ROOT=${PWD}
      # 容器内 localhost 指向容器自己；分发端跑在宿主 8090 端口，
      # 必须用 host.docker.internal，否则推送会被静默跳过（is_distro_configured 为假）
      - DISTRO_BASE_URL=http://host.docker.internal:8090
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./sources:/app/sources
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./backend/app:/app/app
      - ./apps/web/dist:/app/app/static
      # data/sql/azerothcore-updates 是指向 AzerothCore updates 的绝对路径软链接，
      # 容器内需按原路径挂载目标目录，否则链接悬空导致 SQL 写入报 EEXIST
      - /Users/deadwalk/Code/azerothcore-wotlk/modules/mod-custom-content/data/sql/db-world/updates:/Users/deadwalk/Code/azerothcore-wotlk/modules/mod-custom-content/data/sql/db-world/updates
    networks:
      - acore-resources-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # 后端服务：纯 FastAPI API（可选，用于前后端分离测试）
  # 访问地址：http://localhost:8000
  # 启用时请将前端 VITE_API_BASE_URL 指向 http://localhost:8000
  # ============================================
  # backend:
  #   build:
  #     context: .
  #     dockerfile: docker/backend/Dockerfile
  #   container_name: acore-resources-backend
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - PROJECT_ROOT=/app
  #   volumes:
  #     - ./sources:/app/sources
  #     - ./data:/app/data
  #     - ./workspace:/app/workspace
  #     - ./backend/app:/app/app
  #     - ./apps/web/dist:/app/app/static
  #   networks:
  #     - acore-resources-network
  #   restart: unless-stopped

networks:
  acore-resources-network:
    driver: bridge
