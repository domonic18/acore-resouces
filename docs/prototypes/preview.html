<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源预览 — acore-resouces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .viewer-container {
      display: grid;
      grid-template-columns: 280px 1fr 300px;
      gap: 20px;
      height: calc(100vh - 120px);
      min-height: 600px;
    }
    .viewer-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .viewer-canvas {
      flex: 1;
      background: linear-gradient(135deg, #0f1118 0%, #1a1d27 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .viewer-model {
      width: 200px;
      height: 200px;
      position: relative;
      z-index: 1;
    }
    .viewer-model svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 30px rgba(99, 102, 241, 0.3));
    }
    .viewer-toolbar {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .texture-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 12px;
    }
    .texture-item {
      aspect-ratio: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .texture-item:hover, .texture-item.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
    }
    .panel-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
    }
    .meta-list {
      padding: 12px 16px;
      font-size: 12px;
    }
    .meta-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .meta-item:last-child {
      border-bottom: none;
    }
    .meta-label {
      color: var(--text-tertiary);
    }
    .meta-value {
      color: var(--text-primary);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-mark">A</div>
        <div>
          <div class="logo-text">acore-resouces</div>
          <div class="logo-version">AzerothCore 资源管理</div>
        </div>
      </div>
      <nav class="nav-section">
        <div class="nav-label">主菜单</div>
        <a href="index.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          仪表盘
        </a>
        <a href="resources.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          资源列表
        </a>
        <a href="import.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          导入资源
        </a>
        <a href="export.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出补丁
        </a>
        <a href="preview.html" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          资源预览
        </a>
        <div class="nav-label" style="margin-top: 16px">系统</div>
        <a href="settings.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          设置
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar">GM</div>
          <div class="user-info">
            <div class="user-name">Game Master</div>
            <div class="user-role">资源管理员</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div style="display: flex; align-items: center; gap: 12px;">
          <a href="resources.html" class="btn btn-sm btn-ghost">← 返回列表</a>
          <h1 class="page-title">资源预览：钢铁碎天兽</h1>
        </div>
        <div class="topbar-actions">
          <a href="resource-detail.html" class="btn">编辑资源</a>
          <button class="btn btn-primary">重新转换</button>
        </div>
      </header>

      <div class="content">
        <div class="viewer-container">
          <!-- Left: File Tree -->
          <div class="viewer-panel"
            <div class="panel-header">文件树</div>
            <div class="panel-body">
              <div class="file-tree" style="padding: 8px;">
                <div class="file-tree-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                  chimera2钢铁碎天兽
                </div>
                <div class="file-tree-item" style="padding-left: 28px;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                  chimera2.m2
                </div>
                <div class="file-tree-item" style="padding-left: 28px; color: var(--accent);">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                  skin.blp
                </div>
                <div class="file-tree-item" style="padding-left: 28px;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                  glow.blp
                </div>
                <div class="file-tree-item" style="padding-left: 28px;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                  icon.png
                </div>
              </div>
            </div>
            <div class="panel-footer">
              <button class="btn btn-sm" style="width: 100%;">打开资源目录</button>
            </div>
          </div>

          <!-- Center: 3D Viewer -->
          <div class="viewer-panel">
            <div class="viewer-canvas">
              <div class="viewer-model">
                <svg viewBox="0 0 200 200" fill="none">
                  <defs>
                    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
                      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
                    </linearGradient>
                  </defs>
                  <ellipse cx="100" cy="160" rx="60" ry="12" fill="rgba(99,102,241,0.2)" />
                  <!-- Body -->
                  <path d="M60 130 Q60 70 100 60 Q140 70 140 130 Q140 150 100 150 Q60 150 60 130" fill="url(#bodyGrad)" opacity="0.9" />
                  <!-- Head -->
                  <path d="M80 65 Q100 35 120 65 Q115 85 100 85 Q85 85 80 65" fill="#818cf8" opacity="0.95" />
                  <!-- Wings -->
                  <path d="M70 90 Q30 60 20 100 Q50 120 70 110" fill="#4f46e5" opacity="0.7" />
                  <path d="M130 90 Q170 60 180 100 Q150 120 130 110" fill="#4f46e5" opacity="0.7" />
                  <!-- Eyes -->
                  <circle cx="90" cy="65" r="4" fill="white" opacity="0.9" />
                  <circle cx="110" cy="65" r="4" fill="white" opacity="0.9" />
                  <circle cx="91" cy="66" r="2" fill="#1e1b4b" />
                  <circle cx="111" cy="66" r="2" fill="#1e1b4b" />
                </svg>
              </div>
            </div>
            <div class="viewer-toolbar">
              <button class="btn btn-sm">旋转</button>
              <button class="btn btn-sm">缩放</button>
              <button class="btn btn-sm">平移</button>
              <button class="btn btn-sm">重置视角</button>
              <button class="btn btn-sm">线框模式</button>
            </div>
          </div>

          <!-- Right: Textures & Meta -->
          <div class="viewer-panel">
            <div class="panel-header">贴图变体</div>
            <div class="panel-body">
              <div class="texture-grid">
                <div class="texture-item active">🐉</div>
                <div class="texture-item">🔥</div>
                <div class="texture-item">❄️</div>
                <div class="texture-item">⚡</div>
              </div>
              <div style="padding: 0 16px 16px;">
                <div style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">当前贴图</div>
                <div style="font-size: 13px; color: var(--text-primary); font-weight: 500;">skin.blp</div>
                <div style="font-size: 11px; color: var(--text-tertiary); margin-top: 4px;">512 × 512 · BLP2</div>
              </div>

              <div style="border-top: 1px solid var(--border);"></div>
              <div class="panel-header" style="border-bottom: none;">模型元数据</div>
              <div class="meta-list">
                <div class="meta-item">
                  <span class="meta-label">顶点数</span>
                  <span class="meta-value">8,192</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">面数</span>
                  <span class="meta-value">4,096</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">贴图槽位</span>
                  <span class="meta-value">3</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">动画数量</span>
                  <span class="meta-value">24</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Geoset</span>
                  <span class="meta-value">6</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">转换状态</span>
                  <span class="meta-value" style="color: var(--success);">成功</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
