<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="resWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0522d" />
      <stop offset="100%" stop-color="#5c2e0d" />
    </linearGradient>
    <linearGradient id="resGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#daa520" />
      <stop offset="100%" stop-color="#8b6914" />
    </linearGradient>
    <linearGradient id="resGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8dc" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
  </defs>

  <!-- 宝箱底部 -->
  <rect x="4" y="14" width="24" height="12" rx="1.5" fill="url(#resWood)" stroke="#3d1f08" stroke-width="1" />
  <!-- 宝箱盖 -->
  <path d="M3 14l3.5-7h19l3.5 7H3z" fill="url(#resWood)" stroke="#3d1f08" stroke-width="1" stroke-linejoin="round" />

  <!-- 金属包边 -->
  <rect x="7" y="14" width="2" height="12" fill="url(#resGold)" />
  <rect x="23" y="14" width="2" height="12" fill="url(#resGold)" />
  <rect x="4" y="14" width="24" height="2.5" fill="url(#resGold)" />

  <!-- 锁 -->
  <circle cx="16" cy="17" r="3" fill="url(#resGold)" stroke="#6b4e0a" stroke-width="0.5" />
  <rect x="15" y="16" width="2" height="2.5" rx="0.3" fill="#3d1f08" />

  <!-- 宝藏光芒 -->
  <path d="M16 19l2.5 2.5-2.5 2.5-2.5-2.5 2.5-2.5z" fill="url(#resGlow)" opacity="0.95" />
  <path d="M10 11l1-2M22 11l-1-2M16 9v-2" stroke="url(#resGlow)" stroke-width="1" stroke-linecap="round" />
</svg>
